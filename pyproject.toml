[project]
name = "aechak-ai"
version = "0.1.0"
description = "애착 AI 서버. 상품·리뷰 콘텐츠 검수 파이프라인"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "aiokafka>=0.13",
    "anthropic>=1.15",
]

# LangChain·LangGraph를 쓰지 않는다. 측정 근거는 docs/adr-001-no-orchestration-framework.md 에 적었다.
# 요약하면 langgraph는 langchain-core와 langsmith를 하드 의존으로 끌고 와 의존성이 16개에서 42개로 늘고,
# 이 파이프라인에서 쓸 기능(병렬 팬아웃·조건부 분기·재시도)은 asyncio로 더 적은 코드로 된다.
# 유일한 우위인 interrupt 기반 중단·재개는 어드민 심사 재개 흐름이 범위에 없어서 쓸 자리가 없다.

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.14",
    "respx>=0.22",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

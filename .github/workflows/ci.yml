name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
          enable-cache: true

      # 락파일을 고정해 해석한다. 고정하지 않으면 langchain 계열처럼 빠르게 움직이는
      # 패키지가 날마다 다른 버전으로 들어와 재현 불가능한 실패를 만든다.
      - name: install
        run: uv sync --frozen

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 실 브로커가 필요한 왕복 테스트는 AECHAK_AI_LIVE_KAFKA 가 없어 자동으로 건너뛴다.
      - name: test
        run: uv run pytest -q

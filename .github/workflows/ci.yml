name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 배포 워크플로가 생긴 뒤로는 워크플로 파일의 오류가 배포 시점에야 드러난다. PR에서 먼저 거른다.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # SC2016은 JMESPath 질의를 홑따옴표로 감싼 자리를 셸 확장 누락으로 오인한다
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -ignore SC2016

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.21"
          enable-cache: true

      # 락파일을 고정해 해석한다. 고정하지 않으면 langchain 계열처럼 빠르게 움직이는
      # 패키지가 날마다 다른 버전으로 들어와 재현 불가능한 실패를 만든다.
      - name: install
        run: uv sync --frozen

      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # 실 브로커가 필요한 왕복 테스트는 AECHAK_AI_LIVE_KAFKA 가 없어 자동으로 건너뛴다.
      - name: test
        run: uv run pytest -q
